name: API checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zirphas-os-backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zirphas_test
          POSTGRES_PASSWORD: isolated_ci_database
          POSTGRES_DB: zirphas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zirphas_test -d zirphas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://zirphas_test:isolated_ci_database@localhost:5432/zirphas_test
      TEST_POSTGRES_URL: postgresql+psycopg://zirphas_test:isolated_ci_database@localhost:5432/zirphas_test
      SECRET_KEY: ci-only-ephemeral-signing-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zirphas-os-backend/requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt pytest-cov==7.1.0
      - name: Apply migrations to PostgreSQL
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests
        run: python -m pytest -q --junitxml=pytest-results.xml --cov=app --cov-report=term-missing:skip-covered
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: zirphas-os-backend/pytest-results.xml
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zirphas-os-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis tools
        run: python -m pip install ruff==0.17.5 bandit==1.9.4 pip-audit==2.10.1
      - name: Lint (ruff, including flake8-bandit rules)
        run: ruff check app tests
      - name: Static security analysis (bandit)
        run: bandit -r app -ll
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
